[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "/migrations/"

[tool.coverage.run]
source = ["accounts", "appointments", "config", "doctors"]
omit = ["*/migrations/*", "*/settings/*", "manage.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
