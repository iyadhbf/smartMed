<div class="sm-field{% if field.errors %} has-error{% endif %}">
  <label class="sm-field__label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="sm-field__help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="sm-field__error">{{ error }}</p>{% endfor %}
</div>
